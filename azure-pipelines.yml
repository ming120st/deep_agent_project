# Docker
# Build and push an image to Azure Container Registry
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
- main

resources:
- repo: self

variables:
  # Container registry service connection established during pipeline creation
  dockerRegistryServiceConnection: 'b183356a-b001-4278-ba98-c8b62bcc9f64'
  imageRepository: 'businessopsagent'
  containerRegistry: 'wmbusinessopsagentacr.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'

  # Agent VM image name
  vmImageName: 'ubuntu-latest'

stages:
- stage: Build
  displayName: Build and push stage
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: Docker@2
      displayName: Build and push an image to container registry
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)

    - task: AzureWebAppContainer@1
      inputs:
        azureSubscription: 'Microsoft Azure(feeb182c-d854-46f7-bb51-25218822dc5c)'
        appName: 'wm-business-ops-agent'
        deployToSlotOrASE: true
        resourceGroupName: 'wm-rgbusiness-ops-agent'
        slotName: 'production'
        containers: 'wmbusinessopsagentacr.azurecr.io/businessopsagent:$(tag)'
